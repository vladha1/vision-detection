<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>fish tank admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: -apple-system, sans-serif; background: #111; color: #eee; padding: 20px; margin: 0; }
  h1 { font-size: 20px; }
  #uploadForm { margin-bottom: 24px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .grid { display: flex; flex-wrap: wrap; gap: 16px; }
  .card { background: #1c1c1c; border-radius: 8px; padding: 10px; width: 150px; text-align: center; }
  .card img { width: 100px; height: auto; background: #0a2846; border-radius: 4px; }
  .swatch { width: 100px; height: 60px; border-radius: 4px; margin: 0 auto; }
  select { padding: 4px; margin-top: 8px; width: 100%; }
  button.delete {
    margin-top: 8px; background: #822; color: #fff; border: none;
    border-radius: 4px; padding: 6px 8px; cursor: pointer; width: 100%;
  }
  input[type=file] { color: #eee; }
  input[type=submit] { padding: 8px 16px; cursor: pointer; }
  #status { margin-bottom: 12px; min-height: 1.2em; }
</style>
</head>
<body>
<h1>Fish Tank Admin (<span id="count">0</span>/20)</h1>
<form id="uploadForm">
  <input type="file" name="photo" accept="image/*" capture="environment" required>
  <select name="temperament">
    <option value="seek">Attract (curious)</option>
    <option value="flee">Repel (scared)</option>
  </select>
  <input type="submit" value="Add fish">
</form>
<div id="status"></div>
<div class="grid" id="grid"></div>
<script src="/static/admin.js"></script>
</body>
</html>
