<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fish Tank &middot; Control</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root {
    --bg0:#070b14; --bg1:#0c1526; --panel:rgba(255,255,255,.045);
    --panel-brd:rgba(255,255,255,.09); --panel-hi:rgba(255,255,255,.14);
    --text:#eaf1fb; --muted:#8ea0bd; --accent:#49b6ff; --accent2:#7a5cff;
    --good:#3ddc84; --pill:rgba(255,255,255,.06); --shadow:0 10px 40px rgba(0,0,0,.45);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{margin:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif; color:var(--text);
    background:
      radial-gradient(1200px 700px at 15% -10%, #16305a55, transparent 60%),
      radial-gradient(1000px 600px at 110% 10%, #4a2a8a44, transparent 55%),
      linear-gradient(180deg,var(--bg1),var(--bg0));
    background-attachment:fixed; min-height:100vh;
    padding:max(20px,env(safe-area-inset-top)) 18px 60px;
  }
  .wrap{max-width:900px;margin:0 auto;}
  header{display:flex;align-items:center;gap:14px;margin:6px 2px 26px;}
  .logo{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:23px;
    background:linear-gradient(150deg,var(--accent),var(--accent2));box-shadow:var(--shadow);}
  header h1{font-size:22px;margin:0;letter-spacing:-.02em;font-weight:700;}
  header p{margin:2px 0 0;color:var(--muted);font-size:13px;}
  .card{background:var(--panel);border:1px solid var(--panel-brd);border-radius:20px;padding:20px;
    margin-bottom:18px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow);}
  .card h2{margin:0 0 4px;font-size:13px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);}
  .card .sub{margin:0 0 16px;color:var(--muted);font-size:13px;}
  .grid{display:grid;gap:10px;}
  .scenes{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));}
  .tile{position:relative;border:1px solid var(--panel-brd);background:var(--pill);border-radius:16px;
    padding:16px 12px;text-align:center;cursor:pointer;transition:.16s ease;color:var(--text);
    font-weight:600;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:8px;}
  .tile .ico{font-size:26px;line-height:1;}
  .tile:hover{border-color:var(--panel-hi);transform:translateY(-2px);background:rgba(255,255,255,.08);}
  .tile.active{border-color:transparent;background:linear-gradient(150deg,var(--accent),var(--accent2));color:#04101e;box-shadow:0 8px 24px #2a6cff40;}
  .seg{display:flex;gap:6px;background:var(--pill);border:1px solid var(--panel-brd);border-radius:14px;padding:5px;}
  .seg button{flex:1;border:0;background:transparent;color:var(--muted);font-weight:600;font-size:14px;padding:11px;border-radius:10px;cursor:pointer;transition:.15s;}
  .seg button.active{background:linear-gradient(150deg,var(--accent),var(--accent2));color:#04101e;}
  .row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;}
  input[type=text]{flex:1;min-width:160px;padding:12px 14px;border-radius:12px;border:1px solid var(--panel-brd);background:rgba(0,0,0,.25);color:var(--text);font-size:14px;outline:none;}
  input[type=text]:focus{border-color:var(--accent);}
  .btn{padding:12px 18px;border:0;border-radius:12px;font-weight:700;font-size:14px;cursor:pointer;background:linear-gradient(150deg,var(--accent),var(--accent2));color:#04101e;}
  .btn:disabled{opacity:.45;cursor:default;}
  .btn.ghost{background:var(--pill);border:1px solid var(--panel-brd);color:var(--text);}
  .status{margin-top:10px;font-size:12.5px;color:var(--muted);min-height:16px;}
  .status.ok{color:var(--good);} .status.err{color:#ff6b6b;}
  .kchips{display:flex;gap:8px;flex-wrap:wrap;}
  .kchips button{border:1px solid var(--panel-brd);background:var(--pill);color:var(--text);font-weight:600;font-size:13.5px;padding:9px 14px;border-radius:11px;cursor:pointer;transition:.15s;}
  .kchips button:hover{border-color:var(--panel-hi);}
  .kchips button.active{background:linear-gradient(150deg,var(--accent),var(--accent2));color:#04101e;border-color:transparent;}
  .device{display:flex;align-items:center;gap:9px;margin-bottom:11px;}
  .device .dot{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 8px var(--good);}
  .device b{font-size:15px;font-weight:700;} .device span{color:var(--muted);font-size:12.5px;}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  @media (max-width:640px){.split{grid-template-columns:1fr;}}
  a.link{color:var(--accent);text-decoration:none;font-size:13px;}
  .drop{position:relative;display:block;border:2px dashed var(--panel-hi);border-radius:16px;padding:24px;text-align:center;cursor:pointer;transition:.15s;background:rgba(0,0,0,.15);}
  .drop:hover,.drop.drag{border-color:var(--accent);background:rgba(73,182,255,.06);}
  .drophint{color:var(--muted);font-size:14px;} .drophint .ico{font-size:28px;display:block;margin-bottom:6px;}
  #preview{display:none;max-width:160px;max-height:130px;border-radius:12px;margin:0 auto;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">&#128032;</div>
    <div><h1>Fish Tank</h1><p>Scene &amp; display control</p></div>
  </header>

  <!-- ==== fixed top: scene + display selectors ==== -->
  <div class="card">
    <h2>Scene</h2>
    <p class="sub">What the tank projects &amp; shows.</p>
    <div class="grid scenes" id="scenes"></div>
  </div>

  <div class="split">
    <div class="card">
      <div class="device"><span class="dot"></span><b>Raspberry&nbsp;Pi</b><span>Bangalore</span></div>
      <div class="kchips" data-device="pi">
        <button data-url="http://m4:5050/">Tank</button>
        <button data-url="http://m4:5050/camera">Camera</button>
        <button data-url="https://pinky.vivekladha.com">Pinku</button>
      </div>
      <div class="row"><input type="text" class="kcustom" placeholder="custom URL"><button class="btn kset">Set</button></div>
      <div class="status kstatus"></div>
    </div>
    <div class="card">
      <div class="device"><span class="dot"></span><b>iPad</b><span>Gurugram</span></div>
      <div class="kchips" data-device="ipad">
        <button data-url="/">Tank</button>
        <button data-url="/camera">Camera</button>
      </div>
      <div class="row"><input type="text" class="kcustom" placeholder="custom path (embeddable)"><button class="btn kset">Set</button></div>
      <div class="status kstatus"></div>
    </div>
  </div>

  <!-- ==== bottom: scene-specific controls (appear/disappear here only) ==== -->
  <div class="card" data-scene="fish">
    <h2>Add a fish</h2>
    <p class="sub">Draw a fish on paper, snap a photo &mdash; it joins the tank (attract/repel is random).</p>
    <label class="drop" id="drop">
      <img id="preview" alt="">
      <div class="drophint" id="drophint"><span class="ico">&#128247;</span>Tap to take a photo or choose one</div>
      <input type="file" id="file" accept="image/*" capture="environment" hidden>
    </label>
    <div class="row"><button class="btn" id="addFish" disabled>Add fish</button></div>
    <div class="status" id="addStatus"></div>
  </div>

  <div class="card" data-scene="pacman">
    <h2>Pac-Man input</h2>
    <p class="sub">How the Pac-Man scene is controlled.</p>
    <div class="seg" id="inputSeg">
      <button data-mode="hand">&#9995;&nbsp; Hand</button>
      <button data-mode="controller">&#128241;&nbsp; Phone</button>
    </div>
    <div class="row">
      <button class="btn ghost" id="pmReset">Reset Pac-Man game</button>
      <a class="link" href="/controller" target="_blank" style="align-self:center;">Open phone controller &rarr;</a>
    </div>
  </div>
</div>

<script>
function j(url,opts){return fetch(url,opts).then(function(r){return r.json();});}

// ---- Scenes (also toggles scene-specific cards) ----
var SCENE_META={fish:['&#128032;','Fish'],flowers:['&#127800;','Flowers'],pacman:['&#128126;','Pac-Man'],
  driving:['&#128663;','Driving'],paint:['&#127912;','Paint'],constellation:['&#10024;','Stars']};
var scenesEl=document.getElementById('scenes');
function applyScene(cur){
  Array.prototype.forEach.call(document.querySelectorAll('[data-scene]'), function(el){
    el.style.display=(el.getAttribute('data-scene')===cur)?'':'none';
  });
}
function loadScenes(){
  Promise.all([j('/api/scenes'),j('/api/scene')]).then(function(a){
    var list=a[0]||[], cur=(a[1]&&a[1].scene)||''; applyScene(cur); scenesEl.innerHTML='';
    list.forEach(function(s){
      var m=SCENE_META[s]||['&#127760;',s]; var b=document.createElement('div');
      b.className='tile'+(s===cur?' active':''); b.innerHTML='<span class="ico">'+m[0]+'</span>'+m[1];
      b.onclick=function(){ j('/api/scene',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({scene:s})}).then(loadScenes); };
      scenesEl.appendChild(b);
    });
  });
}

// ---- Kiosk (per device) ----
function initKiosk(card){
  var chips=card.querySelector('.kchips'), device=chips.getAttribute('data-device'), statusEl=card.querySelector('.kstatus');
  function refresh(){ j('/api/kiosk?device='+encodeURIComponent(device)).then(function(d){
      var cur=(d&&d.url)||''; statusEl.textContent='Showing: '+cur;
      Array.prototype.forEach.call(chips.querySelectorAll('button'),function(b){ b.classList.toggle('active', b.getAttribute('data-url')===cur); });
    }).catch(function(){}); }
  function setUrl(u){ j('/api/kiosk',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({device:device,url:u})})
      .then(function(){ statusEl.textContent='Set '+u+' (switches within ~5s)'; refresh(); }); }
  Array.prototype.forEach.call(chips.querySelectorAll('button'),function(b){ b.onclick=function(){ setUrl(b.getAttribute('data-url')); }; });
  card.querySelector('.kset').onclick=function(){ var u=card.querySelector('.kcustom').value.trim(); if(u){ setUrl(u); } };
  refresh(); setInterval(refresh,10000);
}

// ---- Add a fish ----
var drop=document.getElementById('drop'), fileIn=document.getElementById('file'),
    preview=document.getElementById('preview'), drophint=document.getElementById('drophint'),
    addBtn=document.getElementById('addFish'), addStatus=document.getElementById('addStatus');
fileIn.addEventListener('change',function(){
  var f=fileIn.files&&fileIn.files[0]; if(!f) return;
  preview.src=URL.createObjectURL(f); preview.style.display='block'; drophint.style.display='none'; addBtn.disabled=false;
});
['dragover','dragenter'].forEach(function(e){drop.addEventListener(e,function(ev){ev.preventDefault();drop.classList.add('drag');});});
['dragleave','drop'].forEach(function(e){drop.addEventListener(e,function(ev){ev.preventDefault();drop.classList.remove('drag');});});
drop.addEventListener('drop',function(ev){ if(ev.dataTransfer.files[0]){ fileIn.files=ev.dataTransfer.files; fileIn.dispatchEvent(new Event('change')); }});
addBtn.onclick=function(){
  var f=fileIn.files&&fileIn.files[0]; if(!f) return;
  addBtn.disabled=true; addStatus.className='status'; addStatus.textContent='Adding…';
  var fd=new FormData(); fd.append('photo',f); fd.append('temperament', Math.random()<0.5?'seek':'flee');
  fetch('/api/fish',{method:'POST',body:fd}).then(function(r){return r.json().then(function(d){return {ok:r.ok,d:d};});})
    .then(function(res){
      if(res.ok){ addStatus.className='status ok'; addStatus.textContent='Added — it’s swimming now!';
        preview.style.display='none'; drophint.style.display='block'; fileIn.value=''; }
      else { addStatus.className='status err'; addStatus.textContent=(res.d&&res.d.error)||'Could not add fish'; addBtn.disabled=false; }
    }).catch(function(){ addStatus.className='status err'; addStatus.textContent='Upload failed'; addBtn.disabled=false; });
};

// ---- Pac-Man input ----
var seg=document.getElementById('inputSeg');
function refreshInput(){ j('/api/inputmode').then(function(d){ var m=(d&&d.mode)||'controller';
  Array.prototype.forEach.call(seg.querySelectorAll('button'),function(b){ b.classList.toggle('active', b.getAttribute('data-mode')===m); }); }).catch(function(){}); }
Array.prototype.forEach.call(seg.querySelectorAll('button'),function(b){ b.onclick=function(){
  j('/api/inputmode',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:b.getAttribute('data-mode')})}).then(refreshInput); }; });
document.getElementById('pmReset').onclick=function(){ fetch('/api/pmreset',{method:'POST'}); };

loadScenes();
Array.prototype.forEach.call(document.querySelectorAll('.card'), function(c){ if(c.querySelector('.kchips')) initKiosk(c); });
refreshInput();
</script>
</body>
</html>
