<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Fish Tank Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #0e1420;
    --panel: #171f30;
    --panel-2: #1f2a40;
    --accent: #4fb3ff;
    --seek: #3ddc84;
    --flee: #ff6b6b;
    --text: #e8edf5;
    --muted: #8b97ab;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: linear-gradient(180deg, var(--bg), #0a0f18);
    color: var(--text);
    margin: 0;
    padding: 16px 16px 60px;
    min-height: 100vh;
  }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; flex-wrap: wrap; gap: 10px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: 0.2px; }
  .capacity { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
  .capacity-bar { width: 120px; height: 8px; background: var(--panel-2); border-radius: 4px; overflow: hidden; }
  .capacity-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--seek)); transition: width 0.3s ease; }

  .upload-card {
    background: var(--panel);
    border: 1px solid #263049;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 24px;
  }
  .upload-card h2 { margin: 0 0 12px; font-size: 15px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; }
  .drop-zone {
    border: 2px dashed #33415f;
    border-radius: 12px;
    padding: 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    position: relative;
  }
  .drop-zone.drag-over { border-color: var(--accent); background: #14203380; }
  .drop-zone input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .drop-zone .hint { color: var(--muted); font-size: 14px; }
  #preview { max-width: 140px; max-height: 140px; border-radius: 8px; margin: 0 auto 10px; display: none; }

  .toggle-group { display: flex; gap: 8px; margin: 14px 0; }
  .toggle-group label {
    flex: 1; text-align: center; padding: 10px; border-radius: 10px;
    background: var(--panel-2); cursor: pointer; font-weight: 600; font-size: 14px;
    border: 2px solid transparent; transition: all 0.15s;
  }
  .toggle-group input { display: none; }
  .toggle-group input:checked + span { display: block; }
  .toggle-group label:has(input[value=seek]:checked) { border-color: var(--seek); background: #123a2a; }
  .toggle-group label:has(input[value=flee]:checked) { border-color: var(--flee); background: #3a1414; }

  .scene-toggle { display: flex; gap: 8px; flex-wrap: wrap; }
  .scene-toggle button {
    flex: 1; min-width: 100px; padding: 10px; border-radius: 10px; border: 2px solid transparent;
    background: var(--panel-2); color: var(--text); font-weight: 600; font-size: 14px;
    cursor: pointer; text-transform: capitalize; transition: all 0.15s;
  }
  .scene-toggle button.active { border-color: var(--accent); background: #123049; }

  button.primary {
    width: 100%; padding: 12px; border: none; border-radius: 10px;
    background: var(--accent); color: #041018; font-weight: 700; font-size: 15px;
    cursor: pointer; margin-top: 4px;
  }
  button.primary:disabled { opacity: 0.5; cursor: default; }

  #status { min-height: 20px; margin-top: 10px; font-size: 14px; text-align: center; }
  #status.ok { color: var(--seek); }
  #status.err { color: var(--flee); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; }
  .card {
    background: var(--panel); border: 1px solid #263049; border-radius: 12px;
    padding: 12px; text-align: center; display: flex; flex-direction: column; gap: 8px;
  }
  .card img { width: 100%; max-width: 100px; height: 70px; object-fit: contain; background: #0a2846; border-radius: 8px; margin: 0 auto; }
  .swatch { width: 100%; max-width: 100px; height: 60px; border-radius: 8px; margin: 0 auto; }
  .badge-toggle { display: flex; gap: 6px; }
  .badge-toggle button {
    flex: 1; border: none; border-radius: 8px; padding: 6px 4px; font-size: 12px; font-weight: 700;
    cursor: pointer; opacity: 0.45; color: #fff;
  }
  .badge-toggle button.seek { background: var(--seek); }
  .badge-toggle button.flee { background: var(--flee); }
  .badge-toggle button.active { opacity: 1; }
  button.delete {
    background: none; color: var(--muted); border: 1px solid #33415f;
    border-radius: 8px; padding: 6px; cursor: pointer; font-size: 12px;
  }
  button.delete:hover { color: var(--flee); border-color: var(--flee); }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; grid-column: 1 / -1; }
</style>
</head>
<body>
<header>
  <h1>Fish Tank Admin</h1>
  <div class="capacity">
    <span id="count">0</span>/20 fish
    <div class="capacity-bar"><div class="capacity-fill" id="capacityFill" style="width:0%"></div></div>
  </div>
</header>

<div class="upload-card">
  <h2>Add a fish</h2>
  <form id="uploadForm">
    <label class="drop-zone" id="dropZone">
      <img id="preview">
      <div class="hint" id="dropHint">Tap to take a photo or choose one from your library</div>
      <input type="file" id="fileInput" name="photo" accept="image/*" required>
    </label>
    <div class="toggle-group">
      <label><input type="radio" name="temperament" value="seek" checked><span>Attract (curious)</span></label>
      <label><input type="radio" name="temperament" value="flee"><span>Repel (scared)</span></label>
    </div>
    <button type="submit" class="primary" id="submitBtn">Add fish</button>
  </form>
  <div id="status"></div>
</div>

<div class="upload-card">
  <h2>Scene</h2>
  <div class="scene-toggle" id="sceneToggle"></div>
</div>

<div class="upload-card">
  <h2>Pac-Man input</h2>
  <div class="scene-toggle" id="inputModeToggle"></div>
  <a href="/controller" target="_blank" style="display:block;margin-top:14px;text-align:center;color:var(--accent);font-size:14px;text-decoration:none;">Open Pac-Man phone controller &rarr;</a>
</div>

<div class="grid" id="grid"></div>
<script src="/static/admin.js"></script>
</body>
</html>
