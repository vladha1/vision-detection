<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>fish tank</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0a2846; overflow: hidden; }
  canvas { display: block; }
  #fsBtn {
    position: fixed; bottom: 12px; right: 12px; z-index: 10;
    opacity: 0.35; font-family: sans-serif; padding: 6px 10px;
    background: #000; color: #fff; border: none; border-radius: 4px; cursor: pointer;
  }
  #fsBtn:hover { opacity: 0.9; }
</style>
</head>
<body>
<canvas id="tank"></canvas>
<button id="fsBtn" onclick="document.documentElement.requestFullscreen()">Fullscreen</button>
<script src="/static/tank.js"></script>
</body>
</html>
