<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Pac-Man Controller</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  :root {
    --bg: #0e1420;
    --panel: #171f30;
    --panel-2: #1f2a40;
    --accent: #ffd23f;
    --text: #e8edf5;
    --muted: #8b97ab;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; user-select: none; }
  html, body { height: 100%; overscroll-behavior: none; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: linear-gradient(180deg, var(--bg), #0a0f18);
    color: var(--text);
    margin: 0;
    padding: 18px 16px 28px;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: 0.3px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 18px; text-align: center; }

  .mode-toggle {
    width: 100%; max-width: 360px; margin-bottom: 18px; padding: 14px;
    border: 2px solid #33415f; border-radius: 14px; background: var(--panel-2);
    color: var(--text); font-size: 16px; font-weight: 700; cursor: pointer;
    transition: all 0.15s;
  }
  .mode-toggle.on { background: #123a2a; border-color: #3ddc84; color: #3ddc84; }

  .scoreboard {
    display: flex; gap: 12px; width: 100%; max-width: 360px; margin-bottom: 26px;
    opacity: 0.4; transition: opacity 0.15s;
  }
  .scoreboard.live { opacity: 1; }
  .dpad { opacity: 0.4; transition: opacity 0.15s; pointer-events: none; }
  .dpad.live { opacity: 1; pointer-events: auto; }
  .stat {
    flex: 1; background: var(--panel); border: 1px solid #263049; border-radius: 14px;
    padding: 12px; text-align: center;
  }
  .stat .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.6px; }
  .stat .value { font-size: 30px; font-weight: 800; margin-top: 2px; }

  .dpad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 14px;
    width: min(96vw, 440px);
    height: min(96vw, 440px);
    margin-top: 6px;
  }
  .dpad button {
    border: none; border-radius: 22px; background: var(--panel-2); color: var(--accent);
    font-size: 64px; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: transform 0.05s, background 0.1s; touch-action: none;
  }
  .dpad button:active, .dpad button.held { background: var(--accent); color: #101010; transform: scale(0.94); }
  .up    { grid-column: 2; grid-row: 1; }
  .left  { grid-column: 1; grid-row: 2; }
  .right { grid-column: 3; grid-row: 2; }
  .down  { grid-column: 2; grid-row: 3; }
  .hub {
    grid-column: 2; grid-row: 2; border-radius: 50%;
    background: #101623; border: 2px solid #263049;
  }

  .reset-btn {
    margin-top: 22px; padding: 12px 26px; border-radius: 12px;
    border: 1px solid #33415f; background: var(--panel); color: var(--muted);
    font-size: 15px; font-weight: 700; cursor: pointer;
  }
  .reset-btn:active { background: #3a1414; border-color: var(--flee, #ff6b6b); color: #ff6b6b; }

  #status { margin-top: 14px; font-size: 13px; color: var(--muted); min-height: 18px; text-align: center; }
  #status.on { color: #3ddc84; }
</style>
</head>
<body>
  <h1>Pac-Man Controller</h1>
  <div class="sub">Take control to play with the buttons below</div>

  <button id="modeToggle" class="mode-toggle">Take control</button>

  <div class="scoreboard">
    <div class="stat"><div class="label">Score</div><div class="value" id="score">0</div></div>
    <div class="stat"><div class="label">Level</div><div class="value" id="level">1</div></div>
    <div class="stat"><div class="label">Lives</div><div class="value" id="lives">3</div></div>
  </div>

  <div class="dpad">
    <button class="up"    data-dir="up"    aria-label="Up">&#9650;</button>
    <button class="left"  data-dir="left"  aria-label="Left">&#9664;</button>
    <div class="hub"></div>
    <button class="right" data-dir="right" aria-label="Right">&#9654;</button>
    <button class="down"  data-dir="down"  aria-label="Down">&#9660;</button>
  </div>

  <button id="resetBtn" class="reset-btn">Reset game</button>

  <div id="status">Connecting&hellip;</div>

  <script src="/static/controller.js"></script>
</body>
</html>
